# Run `mmm-run` locally first so ./artifacts exists (or exec it inside the container).
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data"]
  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data"]
